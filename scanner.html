<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Staff check-in — Sanchari</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/app.css?v=15"></head><body><main class="page-wrap"><a class="page-back" href="index.html">← Back to Sanchari</a><p class="eyebrow">TRANSPORT STAFF</p><h1>Boarding check-in</h1><p class="small-copy">Select your exact journey, scan a passenger’s pass, then confirm boarding. An internet connection is required.</p><section class="surface"><form id="staffLogin"><label class="field">Staff ID<input id="staffId" autocomplete="username" required maxlength="64"></label><label class="field">Access key<input id="staffKey" type="password" autocomplete="current-password" required></label><button class="primary-btn">Start check-in</button></form><div id="scanWorkspace" hidden><button id="staffLogout" class="quiet-btn">Sign out</button><label class="field">Route<select id="scanRoute"><option value="patan">Patancheru</option><option value="miya">Miyapur</option></select></label><label class="field">Direction<select id="scanDirection"><option value="from">From IITH</option><option value="to">To IITH</option></select></label><label class="field">Departure<select id="scanDeparture"></select></label><div class="actions"><button id="startCamera" class="quiet-btn">Open camera</button><button id="stopCamera" class="quiet-btn" hidden>Stop camera</button></div><video id="scanVideo" playsinline muted hidden></video><canvas id="scanCanvas" hidden></canvas><label class="field">Ticket link or QR text<textarea id="scanToken" placeholder="Paste the ticket link if the camera is unavailable"></textarea></label><button id="previewTicket" class="primary-btn">Check this ticket</button><div id="scanPreview" hidden><p id="scanDetails" class="status-box"></p><button id="confirmBoard" class="primary-btn">Confirm boarding</button></div></div><p id="scanStatus" role="status"></p></section></main><script src="assets/shared.js?v=11"></script><script src="assets/jsqr.js?v=1"></script><script src="assets/scanner.js?v=11"></script></body></html>
